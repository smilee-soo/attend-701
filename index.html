<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>501호 출석 체크</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 24px;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }
    .info {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 25px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>501호 출석 체크</h1>
    <p class="subtitle">이름과 비밀번호를 입력하세요</p>
    
    <div class="form-group">
      <label for="name">이름</label>
      <input type="text" id="name" placeholder="예: 장유빈" autocomplete="off">
    </div>
    
    <div class="form-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호" autocomplete="off">
    </div>
    
    <button id="loginBtn" onclick="doLogin()">로그인 후 스캔 시작</button>
    
    <div class="error" id="errorMsg"></div>
    
    <p class="info">
      QR을 501호 태블릿 화면의 QR로 스캔하세요.<br>
      로그인 정보는 브라우저 닫으면 사라집니다.
    </p>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypopD9O5DAtupt_eTAJabXOtvCx8XFumsAjTVFlCFCpi2OvDakRFmxUazIwwZc-Xje/exec';
    
    // 페이지 진입: 토큰이 있으면 자동 로그인, 없으면 기존 세션 확인
    window.addEventListener('DOMContentLoaded', async () => {
      const token = new URLSearchParams(location.search).get('t');
      if (token) {
        history.replaceState(null, '', location.pathname); // 주소창에서 토큰 제거
        await tokenLogin(token);
        return;
      }
      const savedName = sessionStorage.getItem('studentName');
      const savedPw = sessionStorage.getItem('studentPw');
      if (savedName && savedPw) {
        window.location.href = 'scanner.html';
      }
    });

    async function tokenLogin(token) {
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = '자동 로그인 중...';
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'newTokenLogin', token: token })
        });
        const result = await response.json();
        if (result.success) {
          sessionStorage.setItem('studentName', result.name);
          sessionStorage.setItem('studentFullName', result.fullName);
          sessionStorage.setItem('studentPw', result.password);
          window.location.replace('scanner.html');
          return;
        }
        errorMsg.textContent = result.message || '자동 로그인 실패. 직접 로그인해주세요.';
      } catch (err) {
        errorMsg.textContent = '자동 로그인 오류. 직접 로그인해주세요.';
      }
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '로그인 후 스캔 시작';
    }

    
    async function doLogin() {
      const name = document.getElementById('name').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');
      
      errorMsg.style.display = 'none';
      
      if (!name || !password) {
        errorMsg.textContent = '이름과 비밀번호를 입력하세요.';
        errorMsg.style.display = 'block';
        return;
      }
      
      btn.disabled = true;
      btn.textContent = '확인 중...';
      
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'newLogin',
            name: name,
            password: password
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          sessionStorage.setItem('studentName', result.name);
          sessionStorage.setItem('studentFullName', result.fullName);
          sessionStorage.setItem('studentPw', password);
          window.location.href = 'scanner.html';
        } else {
          errorMsg.textContent = result.message || '로그인 실패';
          errorMsg.style.display = 'block';
          btn.disabled = false;
          btn.textContent = '로그인 후 스캔 시작';
        }
      } catch (err) {
        errorMsg.textContent = '서버 연결 오류: ' + err.message;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '로그인 후 스캔 시작';
      }
    }
    
    // 엔터 키로 로그인
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
