<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR 스캔 - 501호</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      color: white;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    .user-info {
      font-size: 14px;
      color: #aaa;
    }
    .logout-btn {
      background: transparent;
      color: #888;
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    #reader video {
      width: 100% !important;
      height: auto !important;
    }
    .start-btn {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .start-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      display: none;
    }
    .status.success {
      background: rgba(76, 175, 80, 0.2);
      border: 2px solid #4caf50;
      color: #a5d6a7;
    }
    .status.error {
      background: rgba(244, 67, 54, 0.2);
      border: 2px solid #f44336;
      color: #ef9a9a;
    }
    .status.info {
      background: rgba(33, 150, 243, 0.2);
      border: 2px solid #2196f3;
      color: #90caf9;
    }
    .footer-info {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>501호 출석 체크</h1>
    <div class="user-info" id="userInfo">-</div>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>
  
  <button class="start-btn" id="startBtn" onclick="startScan()">📷 스캔 시작</button>
  
  <div id="reader" style="display:none;"></div>
  
  <div class="status" id="status"></div>
  
  <div class="footer-info">
    태블릿 화면의 QR을 카메라로 비춰주세요.<br>
    최초 스캔 = 입실 / 이후 스캔 = 퇴실
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypopD9O5DAtupt_eTAJabXOtvCx8XFumsAjTVFlCFCpi2OvDakRFmxUazIwwZc-Xje/exec';
    
    let html5QrCode = null;
    let lastScanTime = 0;
    let isProcessing = false;
    
    // 세션 확인
    const studentName = sessionStorage.getItem('studentName');
    const studentPw = sessionStorage.getItem('studentPw');
    const studentFullName = sessionStorage.getItem('studentFullName');
    
    if (!studentName || !studentPw) {
      window.location.href = 'index.html';
    } else {
      document.getElementById('userInfo').textContent = studentFullName || studentName;
    }
    
    function logout() {
      sessionStorage.clear();
      window.location.href = 'index.html';
    }
    
    function showStatus(type, message, autoHide) {
      const el = document.getElementById('status');
      el.className = 'status ' + type;
      el.textContent = message;
      el.style.display = 'block';
      if (autoHide) {
        setTimeout(() => { el.style.display = 'none'; }, 4000);
      }
    }
    
    async function startScan() {
      const startBtn = document.getElementById('startBtn');
      const reader = document.getElementById('reader');
      
      startBtn.style.display = 'none';
      reader.style.display = 'block';
      
      html5QrCode = new Html5Qrcode('reader');
      
      try {
        await html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
          onScanSuccess,
          () => {}
        );
        showStatus('info', 'QR을 카메라에 비춰주세요', false);
      } catch (err) {
        showStatus('error', '카메라 접근 실패: ' + err.message, false);
        startBtn.style.display = 'block';
        reader.style.display = 'none';
      }
    }
    
    async function onScanSuccess(decodedText) {
      const now = Date.now();
      if (isProcessing) return;
      if (now - lastScanTime < 3000) return;
      lastScanTime = now;
      isProcessing = true;
      
      showStatus('info', '처리 중...', false);
      
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'newSubmitAttendance',
            name: studentName,
            password: studentPw,
            qrCode: decodedText
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          const action = result.action || '기록';
          showStatus('success', '✅ ' + action + ' 완료\n' + result.message, true);
        } else {
          showStatus('error', '❌ ' + (result.message || '실패'), true);
        }
      } catch (err) {
        showStatus('error', '❌ 서버 오류: ' + err.message, true);
      } finally {
        setTimeout(() => { isProcessing = false; }, 3000);
      }
    }
    
    // 페이지 떠날 때 카메라 정리
    window.addEventListener('beforeunload', () => {
      if (html5QrCode) {
        html5QrCode.stop().catch(() => {});
      }
    });
  </script>
</body>
</html>
