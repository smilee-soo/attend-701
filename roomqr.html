<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>501호 출석 QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: white; padding: 20px;
    }
    h1 { font-size: 42px; margin-bottom: 10px; letter-spacing: 2px; }
    .subtitle { color: #888; font-size: 18px; margin-bottom: 30px; }
    .qr-box {
      background: white; padding: 30px; border-radius: 20px;
      box-shadow: 0 20px 60px rgba(255,255,255,0.1); margin-bottom: 30px;
    }
    #qrImage { display: block; width: 400px; height: 400px; }
    .time-info { text-align: center; font-size: 20px; color: #ccc; margin-bottom: 10px; }
    .countdown { font-size: 16px; color: #888; }
    .status { position: fixed; top: 20px; right: 20px; padding: 8px 16px; border-radius: 8px; font-size: 14px; }
    .status.ok { background: rgba(76,175,80,0.2); color: #a5d6a7; }
    .status.err { background: rgba(244,67,54,0.2); color: #ef9a9a; }
    .loading { color: #888; font-size: 24px; }

    /* 잠금 화면 */
    #gate {
      position: fixed; inset: 0; background: #000; z-index: 100;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #gate h2 { font-size: 28px; }
    #gate p { color: #888; font-size: 16px; }
    #pwInput {
      width: 280px; padding: 14px; font-size: 20px; border-radius: 10px;
      border: 1px solid #444; background: #111; color: #fff; text-align: center;
    }
    #pwBtn {
      width: 280px; padding: 14px; font-size: 18px; border: none; border-radius: 10px;
      background: #4caf50; color: #fff; cursor: pointer;
    }
    #pwBtn:disabled { background: #555; }
    #pwMsg { color: #ef9a9a; min-height: 20px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="gate">
    <h2>🔒 501호 출석 QR</h2>
    <p>관리자 비밀번호를 입력하세요</p>
    <input type="password" id="pwInput" placeholder="비밀번호" autocomplete="off">
    <button id="pwBtn" onclick="unlock()">확인</button>
    <div id="pwMsg"></div>
  </div>

  <div class="status ok" id="status">🟢 연결됨</div>
  <h1>501호 출석 체크</h1>
  <p class="subtitle">폰으로 QR을 스캔하세요</p>

  <div class="qr-box">
    <img id="qrImage" alt="QR 코드" style="display:none;">
    <div id="loadingMsg" class="loading">QR 생성 중...</div>
  </div>

  <div class="time-info" id="displayTime">--:--</div>
  <div class="countdown" id="countdown">다음 갱신: --</div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypopD9O5DAtupt_eTAJabXOtvCx8XFumsAjTVFlCFCpi2OvDakRFmxUazIwwZc-Xje/exec';
    const TOKEN_KEY = 'qrToken501';

    let currentCode = '';
    let countdownInterval = null;
    let refreshTimeout = null;

    async function callApi(body) {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      return res.json();
    }

    function showGate(msg) {
      if (refreshTimeout) clearTimeout(refreshTimeout);
      if (countdownInterval) clearInterval(countdownInterval);
      currentCode = '';
      document.getElementById('qrImage').style.display = 'none';
      document.getElementById('qrImage').removeAttribute('src');
      document.getElementById('gate').style.display = 'flex';
      document.getElementById('pwMsg').textContent = msg || '';
      document.getElementById('pwInput').focus();
    }

    async function unlock() {
      const pw = document.getElementById('pwInput').value.trim();
      if (!pw) return;
      const btn = document.getElementById('pwBtn');
      btn.disabled = true; btn.textContent = '확인 중...';
      try {
        const r = await callApi({ action: 'newUnlockQR', password: pw });
        if (r && r.success && r.token) {
          localStorage.setItem(TOKEN_KEY, r.token);
          document.getElementById('pwInput').value = '';
          document.getElementById('gate').style.display = 'none';
          loadQR();
        } else {
          document.getElementById('pwMsg').textContent = (r && r.message) || '실패했습니다.';
        }
      } catch (e) {
        document.getElementById('pwMsg').textContent = '오류: ' + e.message;
      }
      btn.disabled = false; btn.textContent = '확인';
    }
    document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

    function generateQR(text) {
      const primary = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=' + encodeURIComponent(text);
      const fallback = 'https://quickchart.io/qr?text=' + encodeURIComponent(text) + '&size=400';
      const img = document.getElementById('qrImage');
      const loading = document.getElementById('loadingMsg');
      img.onload = () => { img.style.display = 'block'; loading.style.display = 'none'; };
      img.onerror = () => {
        img.onerror = () => { loading.textContent = 'QR 생성 실패'; };
        img.src = fallback;
      };
      img.src = primary;
    }

    function setStatus(type, text) {
      const el = document.getElementById('status');
      el.className = 'status ' + (type === 'ok' ? 'ok' : 'err');
      el.textContent = text;
    }

    function startCountdown(seconds) {
      if (countdownInterval) clearInterval(countdownInterval);
      let remaining = seconds;
      const update = () => {
        const min = Math.floor(remaining / 60);
        const sec = remaining % 60;
        document.getElementById('countdown').textContent =
          '다음 갱신: ' + min + '분 ' + (sec < 10 ? '0' : '') + sec + '초';
        remaining--;
        if (remaining < 0) clearInterval(countdownInterval);
      };
      update();
      countdownInterval = setInterval(update, 1000);
    }

    async function loadQR() {
      const token = localStorage.getItem(TOKEN_KEY) || '';
      if (!token) { showGate(); return; }
      try {
        const data = await callApi({ action: 'newGetQR', token: token });

        if (data && data.locked) {
          localStorage.removeItem(TOKEN_KEY);
          showGate('인증이 만료되었습니다. 비밀번호를 다시 입력하세요.');
          return;
        }
        if (!data || !data.code) {
          setStatus('err', '🔴 데이터 오류');
          if (refreshTimeout) clearTimeout(refreshTimeout);
          refreshTimeout = setTimeout(loadQR, 30000);
          return;
        }
        if (data.code !== currentCode) {
          currentCode = data.code;
          generateQR(data.code);
        }
        document.getElementById('displayTime').textContent = data.displayTime || '--:--';
        const secs = data.secondsToNext || 900;
        startCountdown(secs);
        setStatus('ok', '🟢 연결됨');
        if (refreshTimeout) clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(loadQR, (secs + 2) * 1000);
      } catch (err) {
        setStatus('err', '🔴 오류: ' + err.message);
        if (refreshTimeout) clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(loadQR, 30000);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && document.getElementById('gate').style.display !== 'flex') loadQR();
    });

    loadQR();
  </script>
</body>
</html>
